<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Library Catalog - T-HUB</title>
    <link rel="stylesheet" href="/css/books.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/app-theme.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="books-container students-container">
        <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Toggle Navigation"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <aside class="sidebar">
        <div class="logo">
          <img
            id="appHeaderLogo"
            src="https://api.dicebear.com/7.x/initials/svg?seed=Library"
            alt="Library Logo"
          />
          <h2>T-HUB</h2>
        </div>

        <ul class="menu">
          <li><a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
          <li class="active"><a href="books.html"><i class="fa-solid fa-book-open"></i><span>Catalog</span></a></li>
          <li><a href="library.html"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Inventory &amp; Circulation</span></a></li>
          <li><a href="library-reports.html"><i class="fa-solid fa-chart-line"></i><span>Library Reports</span></a></li>
          <li><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        </ul>
      </aside>
      <main class="books-main-content students-main-content">
        <div id="booksPageNotice" class="books-page-notice" role="status" aria-live="polite" hidden></div>

        <div class="catalog-container" id="booksCatalog" hidden>

          <div class="catalog-header">
            <h2>Library Catalog</h2>
            <div class="catalog-header-actions">
              <button id="refreshBooksCatalog" class="books-refresh-button" type="button" aria-label="Refresh library catalog">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                <span>Refresh</span>
              </button>
              <button id="booksThemeToggle" class="books-refresh-button app-theme-toggle" type="button" aria-label="Toggle theme">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
                <span>Theme</span>
              </button>
            </div>
            <div class="catalog-search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="catalogSearchInput"
                placeholder="Search by title, author, or category..."
              />
            </div>
          </div>

          <div id="bookCardGrid" class="book-card-grid">

          </div>
          <div class="books-pagination">
            <button id="nextBooksPage" type="button" hidden>Next</button>
          </div>
        </div>
      </main>
    </div>

    <div
      id="studentHistoryModal"
      class="student-modal-overlay"
      style="display: none"
    >
      <div class="student-modal-card">
        <div class="student-modal-header">
          <h3 id="studentHistoryModalTitle">Book Details &amp; Circulation</h3>
          <button
            class="student-modal-close-btn"
            onclick="closeStudentHistoryModal()"
            aria-label="Close modal"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="studentHistoryContent" class="student-modal-body">

        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/spa-router.js"></script>
    <script src="/js/books.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
