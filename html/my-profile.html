  <body>
    <div class="academics-container">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation" type="button">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <aside class="sidebar">
        <div class="logo">
          <img id="appHeaderLogo" src="https://api.dicebear.com/7.x/initials/svg?seed=Library" alt="Library Logo" />
          <h2>T-HUB</h2>
        </div>
        <ul class="menu">
          <li><a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
          <li><a href="books.html"><i class="fa-solid fa-book-open"></i><span>Catalog</span></a></li>
          <li><a href="library.html"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Inventory &amp; Circulation</span></a></li>
          <li><a href="library-reports.html"><i class="fa-solid fa-chart-line"></i><span>Library Reports</span></a></li>
          <li class="active"><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        </ul>
      </aside>
      <main class="settings-main-content">
    <section class="my-profiles-page" id="myProfile">
      <div class="page-header">
        <h2>My Profile</h2>
        <p>Manage profile information.</p>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
        <button
          id="profileThemeToggle"
          class="app-theme-toggle back-my-profiles-btn"
          type="button"
          aria-label="Toggle theme"
          style="margin-bottom: 0; width: auto; padding: 0 14px; gap: 8px;"
        >
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
          <span>Theme</span>
        </button>
      </div>

      <form id="myProfileForm" class="my-profiles-form">
        <div class="form-section" id="profileInformationSection">
          <h3>Update Profile Information</h3>

          <p
            id="profileInformationNotice"
            class="profile-information-notice"
            hidden
          ></p>

          <div class="avatar-upload-group">
            <div class="avatar-edit-container">
              <div class="my-profile-upload">
                <img
                  id="profileAvatar"
                  src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                  alt="Profile Picture"
                  style="
                    width: 150px;
                    height: 150px;
                    border-radius: 50%;
                    object-fit: cover;
                    display: block;
                    margin: 0 auto;
                  "
                  onerror="
                    this.onerror = null;
                    this.src =
                      'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                  "
                />

                <div class="avatar-upload-actions" id="profilePhotoActions">
                  <label for="myProfilePhoto" class="btn-secondary upload-btn">
                    <i class="bx bx-upload"></i> Change Photo
                  </label>
                  <input
                    type="file"
                    id="myProfilePhoto"
                    accept="image/*"
                    hidden
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="fullName">Full Name</label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter Full Name"
                required
              />
            </div>

            <div class="form-group">
              <label for="emailAddress">Email Address</label>

              <input
                type="email"
                id="emailAddress"
                placeholder="Enter Email Address"
                required
              />
            </div>

            <div class="form-group">
              <label for="phoneNumber">Phone Number</label>

              <input
                type="tel"
                id="phoneNumber"
                placeholder="Enter Phone Number"
                required
              />
            </div>
          </div>

          <div class="form-actions">
            <button
              type="reset"
              class="cancel-btn"
              id="resetProfileInfo"
            >
              Reset
            </button>

            <button type="submit" id="saveProfileInfo" class="save-btn">
              Save Changes
            </button>
          </div>
        </div>
      </form>

      <form id="changeMyPassword" class="my-profiles-form">
        <div class="form-section">
          <h3>Change Password</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>

              <div class="password-field">
                <input
                  type="password"
                  id="currentPassword"
                  placeholder="Enter Current Password"
                  required
                />

                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('currentPassword', this)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="newPassword">New Password</label>

              <div class="password-field">
                <input
                  type="password"
                  id="newPassword"
                  placeholder="Enter New Password"
                  required
                />

                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('newPassword', this)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>

              <div class="password-field">
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                  required
                />

                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('confirmPassword', this)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="reset" class="cancel-btn">Reset</button>

            <button type="submit" class="savepassword-btn">Save Changes</button>
          </div>
        </div>
      </form>
    </section>

    <div id="toastContainer" class="toast-container"></div>
      </main>
    </div>
